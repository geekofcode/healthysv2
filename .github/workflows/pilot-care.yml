name: Cash care pilot validation

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pilot-care-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cash-care:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17-alpine
        env:
          POSTGRES_USER: healthys
          POSTGRES_PASSWORD: healthys-test-only
          POSTGRES_DB: healthys
        ports: ["15432:5432"]
        options: >-
          --health-cmd "pg_isready -U healthys -d healthys"
          --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: migration-tools/requirements.txt
      - name: Verify cash journey, isolation, cutover and retention on PostgreSQL 17
        run: >-
          ./mvnw --batch-mode --no-transfer-progress
          -Dhealthys.test.external-database=true
          -Dspring.datasource.url=jdbc:postgresql://127.0.0.1:15432/healthys
          -Dspring.datasource.username=healthys
          -Dspring.datasource.password=healthys-test-only
          -Dtest=OrganizationRolesIntegrationTests,CashCareJourneyIntegrationTests,CutoverIntegrationTests,RetentionIntegrationTests,DatabaseMigrationIntegrationTests,AiMigrationIntegrationTests,CareMigrationIntegrationTests,PatientIdentityMigrationIntegrationTests
          test
      - name: Install migration tooling
        run: pip install -r migration-tools/requirements.txt
      - name: Prepare isolated historical-import test database
        env:
          TEST_MIGRATION_DATABASE_URL: postgresql://healthys:healthys-test-only@127.0.0.1:15432/healthys_migration_test
        run: |
          python - <<'PY'
          import os,re,pathlib,psycopg
          from psycopg.conninfo import make_conninfo
          target=os.environ['TEST_MIGRATION_DATABASE_URL']
          with psycopg.connect(make_conninfo(target,dbname='healthys'),autocommit=True) as db:
              db.execute('CREATE DATABASE healthys_migration_test')
          with psycopg.connect(target) as db:
              files=pathlib.Path('src/main/resources/db/migration').glob('V*__*.sql')
              for file in sorted(files,key=lambda p:int(re.match(r'V([0-9]+)',p.name)[1])):
                  db.execute(file.read_text(),prepare=False)
          PY
      - name: Verify historical import, replay and protected rollback
        working-directory: migration-tools
        env:
          TEST_MIGRATION_DATABASE_URL: postgresql://healthys:healthys-test-only@127.0.0.1:15432/healthys_migration_test
        run: python -m unittest discover -s tests -v
      - name: Upload synthetic-data test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cash-care-pilot-tests
          path: target/surefire-reports/
          if-no-files-found: warn
