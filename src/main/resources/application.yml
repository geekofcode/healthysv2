spring:
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        one-indexed-parameters: false
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    clean-disabled: true
    validate-migration-naming: true
    out-of-order: false

server:
  shutdown: graceful

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"

healthys:
  access:
    request-duration: ${PATIENT_ACCESS_REQUEST_DURATION:PT48H}
    emergency-duration: ${PATIENT_ACCESS_EMERGENCY_DURATION:PT1H}
    scheduled-grace: ${PATIENT_ACCESS_SCHEDULED_GRACE:PT1H}
  care:
    follow-up-duration: ${CARE_FOLLOW_UP_DURATION:PT168H}
    retention-years: ${DATA_RETENTION_YEARS:30}
  licensing:
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
      return-url: ${STRIPE_RETURN_URL:http://localhost:5173/licensing}
  push:
    enabled: ${PUSH_ENABLED:false}
    fcm-project-id: ${FCM_PROJECT_ID:}
    service-account-file: ${FCM_SERVICE_ACCOUNT_FILE:}
    poll-interval-ms: ${PUSH_POLL_INTERVAL_MS:10000}
  professional-role-sync:
    enabled: ${PROFESSIONAL_ROLE_SYNC_ENABLED:false}
    admin-server-url: ${KEYCLOAK_ADMIN_SERVER_URL:}
    realm: ${KEYCLOAK_ADMIN_REALM:healthys}
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}
    poll-interval-ms: ${PROFESSIONAL_ROLE_SYNC_POLL_INTERVAL_MS:10000}
