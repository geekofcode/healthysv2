server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/healthys}
    username: ${DB_USERNAME:healthys}
    password: ${DB_PASSWORD:healthys-local-change-me}
    driver-class-name: org.postgresql.Driver
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/healthys}

healthys:
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    region: ${STORAGE_REGION:us-east-1}
    bucket: ${STORAGE_BUCKET:healthys}
    access-key: ${STORAGE_ACCESS_KEY:healthys}
    secret-key: ${STORAGE_SECRET_KEY:minio-local-change-me}
    path-style-access: ${STORAGE_PATH_STYLE_ACCESS:true}
