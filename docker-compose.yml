services:
  ai:
    profiles: [ai]
    build:
      context: ai-service
    environment:
      HEALTHYS_AI_SERVICE_TOKEN: ${HEALTHYS_AI_SERVICE_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TEXT_MODEL: ${OPENAI_TEXT_MODEL:-gpt-4.1-mini}
      OPENAI_TRANSCRIPTION_MODEL: ${OPENAI_TRANSCRIPTION_MODEL:-gpt-4o-mini-transcribe}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-50}
      AI_MAX_AUDIO_BYTES: ${AI_MAX_AUDIO_BYTES:-10485760}
      AI_MAX_SNAPSHOT_BYTES: ${AI_MAX_SNAPSHOT_BYTES:-180000}
      AI_MAX_NOTES_CHARS: ${AI_MAX_NOTES_CHARS:-30000}
      AI_MAX_OUTPUT_CHARS: ${AI_MAX_OUTPUT_CHARS:-50000}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-6000}
      AI_MAX_CONCURRENCY: ${AI_MAX_CONCURRENCY:-4}
    networks: [healthys]
    # Private service: no published host port and no frontend route.
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

  backend:
    build:
      context: .
    env_file: .env
    environment:
      SERVER_PORT: 8080
      FCM_SERVICE_ACCOUNT_FILE: ${FCM_SERVICE_ACCOUNT_FILE}
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: DEBUG
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY_OAUTH2: TRACE
    volumes:
      - /Volumes/SSD_DEV/projects/jee/config/healthys-63579014-firebase-adminsdk-fjczq-c0b02ed3c0.json:${FCM_SERVICE_ACCOUNT_FILE}:ro
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks: [healthys]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-healthys}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-healthys-web-apps}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [healthys]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

networks:
  healthys:
    driver: bridge
